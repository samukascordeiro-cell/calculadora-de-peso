<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de IMC</title>
    <link rel="stylesheet" href="calc.css">
</head>
<body>

    <div class="card">
        <h2>Calculadora de IMC</h2>
        <div class="input-group">
            <label for="peso">Peso (kg):</label>
            <input type="number" id="peso" step="0.1" placeholder="Ex: 70">
        </div>
        <div class="input-group">
            <label for="altura">Altura (m ou cm):</label>
            <input type="number" id="altura" step="0.01" placeholder="Ex: 1.75 ou 175">
        </div>
        <button onclick="calcularIMC()">Calcular</button>
        <div id="resultado"></div>
    </div>

    <script src="calc.js"></script>
    
 
</div>

    <h3 class="center" style="color: aquamarine;">Samuel Academy's</h3>
</body>
</html>
